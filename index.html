<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check It AI - Live App & Web Builder</title>
    <style>
        :root {
            --bg-color: #212121;
            --text-color: #ececec;
            --accent-color: #2f2f2f;
            --border-color: #333;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #171717;
        }
        .title {
            font-size: 1.1rem;
            font-weight: 600;
        }
        .view-tabs {
            display: flex;
            gap: 10px;
        }
        .tab-btn {
            background: #2f2f2f;
            border: none;
            color: var(--text-color);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .tab-btn.active {
            background-color: #ececec;
            color: #212121;
            font-weight: bold;
        }
        .main-content {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 100px;
        }
        .message-wrapper {
            display: flex;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .message-wrapper.user {
            justify-content: flex-end;
        }
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }
        .user .message {
            background-color: #2f2f2f;
            color: white;
            border-top-right-radius: 2px;
        }
        .ai .message {
            background-color: transparent;
            color: var(--text-color);
            border: none;
            padding-left: 0;
        }
        .preview-section {
            display: none;
            flex: 1;
            background: #fff;
            border-left: 1px solid var(--border-color);
            height: 100%;
        }
        .preview-section.active-preview {
            display: block;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .input-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(transparent, var(--bg-color) 50%);
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .input-box {
            width: 100%;
            max-width: 800px;
            background-color: #171717;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 8px 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            resize: none;
            height: 24px;
            max-height: 150px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
        }
        .send-btn {
            background-color: #ececec;
            color: #212121;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">Check It AI ⚡ Builder & Preview</div>
        <div class="view-tabs">
            <button class="tab-btn active" id="chat-tab-btn" onclick="switchView('chat')">💬 Chat & Code</button>
            <button class="tab-btn" id="preview-tab-btn" onclick="switchView('preview')">👁️ Live Preview</button>
        </div>
    </div>

    <div class="main-content">
        <!-- Chat Section -->
        <div class="chat-section" id="chat-pane">
            <div class="chat-messages" id="chat-messages">
                <div class="message-wrapper ai">
                    <div class="message">Hello! I am 'Check It AI'. Ask me to build any website or app (e.g., "Create an E-commerce product card or landing page"). I will write the code and you can see it live instantly in the Live Preview tab!</div>
                </div>
            </div>

            <div class="input-container">
                <div class="input-box">
                    <textarea id="user-input" placeholder="Ask for an app, website or code in any language..." rows="1" oninput="autoGrow(this)"></textarea>
                    <button class="send-btn" onclick="sendMessage()">⬆</button>
                </div>
            </div>
        </div>

        <!-- Live Preview Section -->
        <div class="preview-section" id="preview-pane">
            <iframe id="preview-frame"></iframe>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://check-it-ai.onrender.com";
        let lastGeneratedCode = "";

        function switchView(view) {
            const chatPane = document.getElementById('chat-pane');
            const previewPane = document.getElementById('preview-pane');
            const chatBtn = document.getElementById('chat-tab-btn');
            const previewBtn = document.getElementById('preview-tab-btn');

            if (view === 'chat') {
                chatPane.style.display = 'flex';
                previewPane.classList.remove('active-preview');
                chatBtn.classList.add('active');
                previewBtn.classList.remove('active');
            } else {
                chatPane.style.display = 'none';
                previewPane.classList.add('active-preview');
                previewBtn.classList.add('active');
                chatBtn.classList.remove('active');
                
                if (lastGeneratedCode) {
                    updatePreview(lastGeneratedCode);
                } else {
                    document.getElementById('preview-frame').srcdoc = "<h3>No code generated yet. Ask AI to build a webpage first!</h3>";
                }
            }
        }

        function updatePreview(code) {
            const frame = document.getElementById('preview-frame');
            // Extract HTML code if wrapped in markdown code blocks
            let cleanCode = code;
            const match = code.match(/```(?:html)?([\s\S]*?)```/);
            if (match && match[1]) {
                cleanCode = match[1];
            }
            frame.srcdoc = cleanCode;
        }

        function autoGrow(element) {
            element.style.height = '24px';
            element.style.height = (element.scrollHeight) + 'px';
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const messageBox = document.getElementById('chat-messages');
            const text = inputField.value.trim();
            if(!text) return;

            messageBox.innerHTML += `
                <div class="message-wrapper user">
                    <div class="message">${text}</div>
                </div>`;
            inputField.value = '';
            inputField.style.height = '24px';
            messageBox.scrollTop = messageBox.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            messageBox.innerHTML += `
                <div class="message-wrapper ai" id="${loadingId}">
                    <div class="message">Building your app/code...</div>
                </div>`;
            messageBox.scrollTop = messageBox.scrollHeight;

            try {
                const formData = new FormData();
                formData.append("prompt", text);
                formData.append("mode", "App & Web Builder");

                const response = await fetch(`${BACKEND_URL}/api/chat`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                document.getElementById(loadingId).remove();
                if(data.status === "success") {
                    lastGeneratedCode = data.response;
                    messageBox.innerHTML += `
                        <div class="message-wrapper ai">
                            <div class="message">${data.response}</div>
                        </div>`;
                    
                    // Automatically update preview if it contains HTML
                    if (data.response.includes("<html") || data.response.includes("<!DOCTYPE") || data.response.includes("<div")) {
                        updatePreview(data.response);
                    }
                } else {
                    messageBox.innerHTML += `
                        <div class="message-wrapper ai">
                            <div class="message">Error: ${data.error_details}</div>
                        </div>`;
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                messageBox.innerHTML += `
                    <div class="message-wrapper ai">
                        <div class="message">Server connection failed.</div>
                    </div>`;
            }
            messageBox.scrollTop = messageBox.scrollHeight;
        }

        document.getElementById('user-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
