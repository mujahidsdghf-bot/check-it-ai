<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check It AI - Advanced Platform</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --accent-color: #3b82f6;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            padding: 12px 20px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .logo {
            font-weight: bold;
            font-size: 1.1rem;
            color: #fff;
        }
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            width: 100%;
            height: calc(100vh - 50px);
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
            height: 100%;
            position: relative;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            padding: 12px 16px;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.6;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }
        .msg.user {
            background-color: #2563eb;
            color: #fff;
            align-self: flex-end;
        }
        .msg.ai {
            background-color: var(--panel-bg);
            color: var(--text-color);
            align-self: flex-start;
            border: 1px solid var(--border-color);
        }
        /* సెర్చ్/ఇన్‌పుట్ బార్ - స్క్రీన్ కింద పర్‌ఫెక్ట్‌గా ఫిక్స్ అయ్యేలా */
        .search-container {
            padding: 12px 15px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }
        .search-container textarea {
            flex: 1;
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 12px;
            border-radius: 10px;
            resize: none;
            height: 42px;
            outline: none;
            font-family: inherit;
            font-size: 0.95rem;
        }
        .search-container button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            height: 42px;
            font-size: 0.95rem;
        }
        /* ప్రివ్యూ ప్యానెల్ */
        .preview-pane {
            width: 50%;
            background: #ffffff;
            display: none;
            flex-direction: column;
            border-left: 1px solid var(--border-color);
            height: 100%;
        }
        .preview-pane.active {
            display: flex;
        }
        .preview-header {
            background: #f1f5f9;
            padding: 10px 15px;
            font-size: 0.85rem;
            color: #475569;
            border-bottom: 1px solid #cbd5e1;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .download-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
        }
        .close-preview {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        iframe {
            flex: 1;
            width: 100%;
            border: none;
        }

        @media screen and (max-width: 900px) {
            .preview-pane.active {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                z-index: 100;
                height: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">⚡ Check It AI - Advanced Engine</div>
    </div>

    <div class="main-container">
        <!-- Chat Area -->
        <div class="chat-area" id="chat-area">
            <div class="chat-messages" id="chat-messages">
                <div class="msg ai">నమస్కారం! మీకు ఏ యాప్, వెబ్‌సైట్, లేదా సమాచారం కావాలన్నా కింద ఉన్న బాక్స్‌లో టైప్ చేసి అడగండి.</div>
            </div>

            <!-- సెర్చ్/ఇన్‌పుట్ బార్ -->
            <div class="search-container">
                <textarea id="user-input" placeholder="మీకేం కావాలి? ఇక్కడ టైప్ చేయండి..." rows="1" onkeydown="handleKeyPress(event)"></textarea>
                <button onclick="sendPrompt()">Build / Ask</button>
            </div>
        </div>

        <!-- Live Preview Panel -->
        <div class="preview-pane" id="preview-pane">
            <div class="preview-header">
                <span>🌐 Live App / Website Preview</span>
                <div style="display: flex; gap: 8px;">
                    <button class="download-btn" onclick="downloadCode()">📥 Download</button>
                    <button class="close-preview" onclick="togglePreview(false)">❌ Close</button>
                </div>
            </div>
            <iframe id="live-preview"></iframe>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://check-it-ai.onrender.com";
        let lastGeneratedCode = "";

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendPrompt();
            }
        }

        async function sendPrompt() {
            const input = document.getElementById('user-input');
            const messages = document.getElementById('chat-messages');
            const text = input.value.trim();
            if(!text) return;

            messages.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            messages.innerHTML += `<div class="msg ai" id="temp-load">ప్రసెస్ చేయబడుతోంది... (Processing...)</div>`;
            messages.scrollTop = messages.scrollHeight;

            try {
                const formData = new FormData();
                formData.append("prompt", text);
                formData.append("mode", "App & Web Builder");

                const res = await fetch(`${BACKEND_URL}/api/chat`, { method: 'POST', body: formData });
                const data = await res.json();

                document.getElementById('temp-load').remove();

                if(data.status === "success") {
                    lastGeneratedCode = data.response;
                    messages.innerHTML += `<div class="msg ai">${data.response}</div>`;
                    
                    if (data.response.includes("<html") || data.response.includes("<!DOCTYPE") || data.response.includes("<div")) {
                        renderPreview(data.response);
                        togglePreview(true);
                    }
                } else {
                    messages.innerHTML += `<div class="msg ai">సమస్య ఏర్పడింది: ${data.error_details}</div>`;
                }
            } catch(e) {
                document.getElementById('temp-load').remove();
                messages.innerHTML += `<div class="msg ai">కనెక్షన్ విఫలమైంది. దయచేసి మళ్లీ ప్రయత్నించండి.</div>`;
            }
            messages.scrollTop = messages.scrollHeight;
        }

        function renderPreview(code) {
            const iframe = document.getElementById('live-preview');
            let htmlCode = code;
            const match = code.match(/```(?:html)?([\s\S]*?)```/);
            if (match && match[1]) {
                htmlCode = match[1];
            }
            iframe.srcdoc = htmlCode;
        }

        function togglePreview(show) {
            const pane = document.getElementById('preview-pane');
            if (show) {
                pane.classList.add('active');
            } else {
                pane.classList.remove('active');
            }
        }

        function downloadCode() {
            if (!lastGeneratedCode) {
                alert("డౌన్‌లోడ్ చేయడానికి ఎలాంటి కోడ్ లేదు!");
                return;
            }
            let htmlCode = lastGeneratedCode;
            const match = lastGeneratedCode.match(/```(?:html)?([\s\S]*?)```/);
            if (match && match[1]) {
                htmlCode = match[1];
            }

            const blob = new Blob([htmlCode], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
