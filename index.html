<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check It AI - Smart Multi-Language Platform</title>
    <style>
        :root {
            --bg-color: #212121;
            --text-color: #ececec;
            --accent-color: #2f2f2f;
            --border-color: #2f2f2f;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-color);
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 100px;
        }
        .message-wrapper {
            display: flex;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .message-wrapper.user {
            justify-content: flex-end;
        }
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }
        .user .message {
            background-color: #2f2f2f;
            color: white;
            border-top-right-radius: 2px;
        }
        .ai .message {
            background-color: transparent;
            color: var(--text-color);
            border: none;
            padding-left: 0;
        }
        .input-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(transparent, var(--bg-color) 50%);
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .input-box {
            width: 100%;
            max-width: 800px;
            background-color: #171717;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 8px 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            resize: none;
            height: 24px;
            max-height: 150px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
        }
        .send-btn {
            background-color: #ececec;
            color: #212121;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .send-btn:hover {
            background-color: #fff;
        }
    </style>
</head>
<body>

    <div class="chat-header">
        Check It AI ⚡ (Auto-Detects Coding, Stories, Repairs & Any Language)
    </div>

    <div class="chat-messages" id="chat-messages">
        <div class="message-wrapper ai">
            <div class="message">Hello! I am 'Check It AI'. Type anything you want—whether it's coding, a story for a movie, a technical repair, or a general question in any language, and I will instantly understand and assist you!</div>
        </div>
    </div>

    <div class="input-container">
        <div class="input-box">
            <textarea id="user-input" placeholder="Type your message here (Ask in any language)..." rows="1" oninput="autoGrow(this)"></textarea>
            <button class="send-btn" onclick="sendMessage()">⬆</button>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://check-it-ai.onrender.com";

        function autoGrow(element) {
            element.style.height = '24px';
            element.style.height = (element.scrollHeight) + 'px';
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const messageBox = document.getElementById('chat-messages');
            const text = inputField.value.trim();
            if(!text) return;

            messageBox.innerHTML += `
                <div class="message-wrapper user">
                    <div class="message">${text}</div>
                </div>`;
            inputField.value = '';
            inputField.style.height = '24px';
            messageBox.scrollTop = messageBox.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            messageBox.innerHTML += `
                <div class="message-wrapper ai" id="${loadingId}">
                    <div class="message">Thinking...</div>
                </div>`;
            messageBox.scrollTop = messageBox.scrollHeight;

            try {
                const formData = new FormData();
                formData.append("prompt", text);
                formData.append("mode", "Auto-Detect");

                const response = await fetch(`${BACKEND_URL}/api/chat`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                document.getElementById(loadingId).remove();
                if(data.status === "success") {
                    messageBox.innerHTML += `
                        <div class="message-wrapper ai">
                            <div class="message">${data.response}</div>
                        </div>`;
                } else {
                    messageBox.innerHTML += `
                        <div class="message-wrapper ai">
                            <div class="message">Error: ${data.error_details}</div>
                        </div>`;
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                messageBox.innerHTML += `
                    <div class="message-wrapper ai">
                        <div class="message">Server connection failed.</div>
                    </div>`;
            }
            messageBox.scrollTop = messageBox.scrollHeight;
        }

        document.getElementById('user-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
