<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check It AI - Bolt.new Style Platform</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333;
            --accent-color: #3b82f6;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            padding: 12px 20px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-weight: bold;
            font-size: 1.1rem;
            color: #fff;
        }
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .chat-pane {
            width: 45%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            background-color: var(--bg-color);
            position: relative;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 90px;
        }
        .msg {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.5;
            font-size: 0.9rem;
            white-space: pre-wrap;
        }
        .msg.user {
            background-color: #2b2b2b;
            color: #fff;
            align-self: flex-end;
        }
        .msg.ai {
            background-color: transparent;
            color: var(--text-color);
            align-self: flex-start;
        }
        .input-area {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 15px;
            background: var(--bg-color);
            border-top: 1px solid var(--border-color);
            box-sizing: border-box;
            display: flex;
            gap: 10px;
        }
        .input-area textarea {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            resize: none;
            height: 22px;
            outline: none;
            font-family: inherit;
        }
        .input-area button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .preview-pane {
            width: 55%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
        }
        .preview-header {
            background: #f1f5f9;
            padding: 8px 15px;
            font-size: 0.85rem;
            color: #475569;
            border-bottom: 1px solid #cbd5e1;
            font-weight: 600;
        }
        iframe {
            flex: 1;
            width: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">⚡ Check It AI (Bolt.new Engine)</div>
    </div>

    <div class="workspace">
        <!-- Chat Panel -->
        <div class="chat-pane">
            <div class="chat-messages" id="chat-messages">
                <div class="msg ai">Hello! Tell me what kind of app or website you want to build. I will generate and run it live on your screen instantly!</div>
            </div>
            <div class="input-area">
                <textarea id="user-input" placeholder="Describe your app (e.g., E-commerce store, Todo app)..." rows="1"></textarea>
                <button onclick="sendPrompt()">Build</button>
            </div>
        </div>

        <!-- Live Preview Panel -->
        <div class="preview-pane">
            <div class="preview-header">🌐 Live App Preview</div>
            <iframe id="live-preview"></iframe>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://check-it-ai.onrender.com";

        async function sendPrompt() {
            const input = document.getElementById('user-input');
            const messages = document.getElementById('chat-messages');
            const text = input.value.trim();
            if(!text) return;

            messages.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            messages.innerHTML += `<div class="msg ai" id="temp-load">Building application...</div>`;
            messages.scrollTop = messages.scrollHeight;

            try {
                const formData = new FormData();
                formData.append("prompt", text);
                formData.append("mode", "App & Web Builder");

                const res = await fetch(`${BACKEND_URL}/api/chat`, { method: 'POST', body: formData });
                const data = await res.json();

                document.getElementById('temp-load').remove();

                if(data.status === "success") {
                    messages.innerHTML += `<div class="msg ai">App built successfully! Check the live preview.</div>`;
                    renderPreview(data.response);
                } else {
                    messages.innerHTML += `<div class="msg ai">Error: ${data.error_details}</div>`;
                }
            } catch(e) {
                document.getElementById('temp-load').remove();
                messages.innerHTML += `<div class="msg ai">Connection failed.</div>`;
            }
            messages.scrollTop = messages.scrollHeight;
        }

        function renderPreview(code) {
            const iframe = document.getElementById('live-preview');
            let htmlCode = code;
            const match = code.match(/```(?:html)?([\s\S]*?)```/);
            if (match && match[1]) {
                htmlCode = match[1];
            }
            iframe.srcdoc = htmlCode;
        }
    </script>
</body>
</html>
