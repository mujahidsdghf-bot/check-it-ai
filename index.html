<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check It AI - Bolt.new Style Platform</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333;
            --accent-color: #3b82f6;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            padding: 10px 15px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-weight: bold;
            font-size: 1rem;
            color: #fff;
        }
        .mobile-tabs {
            display: none; /* జావాస్క్రిప్ట్ ద్వారా మొబైల్ అయితే ఆటోమేటిక్‌గా ఆన్ అవుతుంది */
            gap: 5px;
        }
        .mobile-tab-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .mobile-tab-btn.active {
            background: var(--accent-color);
        }
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
            width: 100%;
        }
        .chat-pane {
            width: 50%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            background-color: var(--bg-color);
            position: relative;
            height: 100%;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 80px;
        }
        .msg {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.5;
            font-size: 0.9rem;
            white-space: pre-wrap;
        }
        .msg.user {
            background-color: #2b2b2b;
            color: #fff;
            align-self: flex-end;
        }
        .msg.ai {
            background-color: transparent;
            color: var(--text-color);
            align-self: flex-start;
        }
        .input-area {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 10px 15px;
            background: var(--bg-color);
            border-top: 1px solid var(--border-color);
            box-sizing: border-box;
            display: flex;
            gap: 8px;
        }
        .input-area textarea {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            resize: none;
            height: 20px;
            outline: none;
            font-family: inherit;
        }
        .input-area button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .preview-pane {
            width: 50%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .preview-header {
            background: #f1f5f9;
            padding: 8px 15px;
            font-size: 0.8rem;
            color: #475569;
            border-bottom: 1px solid #cbd5e1;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .download-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: bold;
        }
        iframe {
            flex: 1;
            width: 100%;
            border: none;
        }

        /* మొబైల్ క్లాసులు (JS ద్వారా ఆటోమేటిక్‌గా అప్లై అవుతాయి) */
        .mobile-only-hide {
            display: none !important;
        }
        .mobile-only-show {
            display: flex !important;
            width: 100% !important;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">⚡ Check It AI</div>
        <div class="mobile-tabs" id="mobile-tabs-container" style="display: none;">
            <button class="mobile-tab-btn active" id="btn-chat" onclick="switchTab('chat')">💬 Chat & Doubts</button>
            <button class="mobile-tab-btn" id="btn-preview" onclick="switchTab('preview')">🌐 Live Preview</button>
        </div>
    </div>

    <div class="workspace" id="workspace">
        <!-- Chat Panel -->
        <div class="chat-pane" id="chat-pane">
            <div class="chat-messages" id="chat-messages">
                <div class="msg ai">Hello! Ask me to build any app or website. If you have any doubts about the code or features, you can ask me right here!</div>
            </div>
            <div class="input-area">
                <textarea id="user-input" placeholder="Ask anything or request an app..." rows="1"></textarea>
                <button onclick="sendPrompt()">Send</button>
            </div>
        </div>

        <!-- Live Preview Panel -->
        <div class="preview-pane" id="preview-pane">
            <div class="preview-header">
                <span>🌐 Live App Preview</span>
                <button class="download-btn" onclick="downloadCode()">📥 Download Code</button>
            </div>
            <iframe id="live-preview"></iframe>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://check-it-ai.onrender.com";
        let lastGeneratedCode = "";
        let isMobile = false;

        // పేజీ లోడ్ అయిన వెంటనే స్క్రీన్ వెడల్పును బట్టి మొబైలా కాదా అని డిటెక్ట్ చేయడం
        function checkScreenSize() {
            if (window.innerWidth <= 900) {
                isMobile = true;
                document.getElementById('mobile-tabs-container').style.display = 'flex';
                // మొబైల్ అయితే డీఫాల్ట్‌గా ప్రివ్యూని దాచిపెట్టి చాట్ చూపించు
                switchTab('chat');
            } else {
                isMobile = false;
                document.getElementById('mobile-tabs-container').style.display = 'none';
                document.getElementById('chat-pane').classList.remove('mobile-only-hide', 'mobile-only-show');
                document.getElementById('preview-pane').classList.remove('mobile-only-hide', 'mobile-only-show');
                document.getElementById('chat-pane').style.width = '50%';
                document.getElementById('preview-pane').style.width = '50%';
                document.getElementById('chat-pane').style.display = 'flex';
                document.getElementById('preview-pane').style.display = 'flex';
            }
        }

        window.onload = checkScreenSize;
        window.onresize = checkScreenSize;

        function switchTab(tabName) {
            const chatPane = document.getElementById('chat-pane');
            const previewPane = document.getElementById('preview-pane');
            const btnChat = document.getElementById('btn-chat');
            const btnPreview = document.getElementById('btn-preview');

            if (!isMobile) return; // డెస్క్‌టాప్ అయితే ట్యాబ్స్ అవసరం లేదు

            if (tabName === 'chat') {
                chatPane.classList.add('mobile-only-show');
                chatPane.classList.remove('mobile-only-hide');
                previewPane.classList.add('mobile-only-hide');
                previewPane.classList.remove('mobile-only-show');
                
                btnChat.classList.add('active');
                btnPreview.classList.remove('active');
            } else {
                previewPane.classList.add('mobile-only-show');
                previewPane.classList.remove('mobile-only-hide');
                chatPane.classList.add('mobile-only-hide');
                chatPane.classList.remove('mobile-only-show');
                
                btnPreview.classList.add('active');
                btnChat.classList.remove('active');
            }
        }

        async function sendPrompt() {
            const input = document.getElementById('user-input');
            const messages = document.getElementById('chat-messages');
            const text = input.value.trim();
            if(!text) return;

            messages.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            messages.innerHTML += `<div class="msg ai" id="temp-load">Thinking / Building...</div>`;
            messages.scrollTop = messages.scrollHeight;

            try {
                const formData = new FormData();
                formData.append("prompt", text);
                formData.append("mode", "App & Web Builder");

                const res = await fetch(`${BACKEND_URL}/api/chat`, { method: 'POST', body: formData });
                const data = await res.json();

                document.getElementById('temp-load').remove();

                if(data.status === "success") {
                    lastGeneratedCode = data.response;
                    messages.innerHTML += `<div class="msg ai">${data.response}</div>`;
                    
                    if (data.response.includes("<html") || data.response.includes("<!DOCTYPE") || data.response.includes("<div")) {
                        renderPreview(data.response);
                        // మొబైల్ అయితే యాప్ రెడీ కాగానే ఆటోమేటిక్‌గా ప్రివ్యూ ట్యాబ్‌కి మారుతుంది
                        if (isMobile) {
                            switchTab('preview');
                        }
                    }
                } else {
                    messages.innerHTML += `<div class="msg ai">Error: ${data.error_details}</div>`;
                }
            } catch(e) {
                document.getElementById('temp-load').remove();
                messages.innerHTML += `<div class="msg ai">Connection failed.</div>`;
            }
            messages.scrollTop = messages.scrollHeight;
        }

        function renderPreview(code) {
            const iframe = document.getElementById('live-preview');
            let htmlCode = code;
            const match = code.match(/```(?:html)?([\s\S]*?)```/);
            if (match && match[1]) {
                htmlCode = match[1];
            }
            iframe.srcdoc = htmlCode;
        }

        function downloadCode() {
            if (!lastGeneratedCode) {
                alert("No code generated yet to download!");
                return;
            }
            let htmlCode = lastGeneratedCode;
            const match = lastGeneratedCode.match(/```(?:html)?([\s\S]*?)```/);
            if (match && match[1]) {
                htmlCode = match[1];
            }

            const blob = new Blob([htmlCode], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
